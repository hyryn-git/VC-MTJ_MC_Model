[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcmtj-python"
version = "0.1.1"
description = "Field-free VC-MTJ compact probability, resistance, and Monte-Carlo model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
numba = ["numba>=0.59"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["vcmtj*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

